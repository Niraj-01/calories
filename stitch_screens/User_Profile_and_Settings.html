<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>User Profile and Settings</title>
<!-- Tailwind CSS v3 CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Custom Tailwind Configuration for specific aesthetic -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandBlack: '#000000',
            cardBg: 'rgba(255, 255, 255, 0.05)',
            cardBorder: 'rgba(255, 255, 255, 0.08)',
            textSecondary: '#8E8E93',
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
          },
        }
      }
    }
  </script>
<!-- Custom Styles for Glassmorphism and Glow -->
<style data-purpose="glassmorphism">
    .frosted-glass {
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background-color: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    
    .glow-card {
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.05), inset 0 0 10px rgba(255, 255, 255, 0.05);
    }

    /* Subtle divider line between list items */
    .list-divider {
      border-bottom: 0.5px solid rgba(255, 255, 255, 0.1);
    }
    .list-divider:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body class="bg-brandBlack text-white font-sans min-h-screen flex flex-col items-center">
<main class="w-full max-w-md px-6 py-12 flex flex-col gap-8">
<!-- BEGIN: Header Section -->
<header class="flex flex-col gap-6" data-purpose="user-header">
<h1 class="text-4xl font-semibold tracking-tight leading-tight">
        User Profile and <br/>Settings
      </h1>
<div class="flex items-center gap-4">
<!-- User Avatar with NV initials -->
<div class="w-16 h-16 rounded-full bg-gradient-to-br from-zinc-700 to-zinc-900 border border-zinc-600 flex items-center justify-center" data-purpose="avatar">
<span class="text-xl font-medium text-zinc-300">NV</span>
</div>
<span class="text-2xl font-medium">Niraj Vaidya</span>
</div>
</header>
<!-- END: Header Section -->
<!-- BEGIN: Profile Data Form -->
<section class="frosted-glass rounded-2xl overflow-hidden" data-purpose="profile-details">
<div class="flex flex-col">
<!-- Age Row -->
<div class="list-divider flex justify-between items-center px-5 py-4">
<span class="text-lg font-normal">Age</span>
<span class="text-lg text-textSecondary">28</span>
</div>
<!-- Gender Row -->
<div class="list-divider flex justify-between items-center px-5 py-4">
<span class="text-lg font-normal">Gender</span>
<span class="text-lg text-textSecondary">Male</span>
</div>
<!-- Height Row -->
<div class="list-divider flex justify-between items-center px-5 py-4">
<span class="text-lg font-normal">Height</span>
<span class="text-lg text-textSecondary">175 cm</span>
</div>
<!-- Weight Row -->
<div class="list-divider flex justify-between items-center px-5 py-4">
<span class="text-lg font-normal">Weight</span>
<span class="text-lg text-textSecondary">75 kg</span>
</div>
<!-- Activity Level Row -->
<div class="list-divider flex justify-between items-center px-5 py-4">
<span class="text-lg font-normal">Activity Level</span>
<span class="text-lg text-textSecondary">Moderately Active</span>
</div>
<!-- Goal Row -->
<div class="list-divider flex justify-between items-center px-5 py-4">
<span class="text-lg font-normal">Goal</span>
<span class="text-lg text-textSecondary">Maintain Weight</span>
</div>
</div>
</section>
<!-- END: Profile Data Form -->
<!-- BEGIN: BMR/TDEE Stat Card -->
<section class="glow-card rounded-3xl p-8 text-center flex flex-col gap-2" data-purpose="stats-card">
<p class="text-sm tracking-widest text-zinc-400 uppercase">BMR / TDEE</p>
<div class="flex justify-between items-baseline px-2 mt-2">
<div class="flex flex-col">
<span class="text-3xl font-bold tracking-tight">1,750 kcal</span>
</div>
<div class="flex flex-col">
<span class="text-3xl font-bold tracking-tight">2,625 kcal</span>
</div>
</div>
<p class="text-sm text-zinc-500 mt-2">Daily Estimate</p>
</section>
<!-- END: BMR/TDEE Stat Card -->
<!-- BEGIN: Actions -->
<section class="mt-4" data-purpose="account-actions">
<button class="w-full bg-zinc-900 border border-zinc-800 text-zinc-500 py-4 rounded-2xl text-xl font-medium transition-colors hover:bg-zinc-800 active:scale-[0.98]">
        Sign Out
      </button>
</section>
<!-- END: Actions -->
</main>
</body></html>
